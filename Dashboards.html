<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Dashboard Keuangan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    /* Kartu Ringkasan */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }
    
    .card:hover { transform: translateY(-5px); }
    
    .card-icon {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .card-title {
      color: #666;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .card-value {
      font-size: 1.8em;
      font-weight: bold;
      margin-top: 5px;
    }
    
    .card-pemasukan { border-left: 5px solid #4CAF50; }
    .card-pengeluaran { border-left: 5px solid #f44336; }
    .card-sisa { border-left: 5px solid #2196F3; }
    
    .card-pemasukan .card-value { color: #4CAF50; }
    .card-pengeluaran .card-value { color: #f44336; }
    .card-sisa .card-value { color: #2196F3; }
    
    /* Filter */
    .filter-section {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .filter-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .filter-group {
      flex: 1;
      min-width: 200px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
    
    select, button {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }
    
    select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 24px;
    }
    
    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    
    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    
    .chart-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .chart-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }
    
    /* Tabel */
    .table-section {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    
    .table-title {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #333;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.5px;
    }
    
    tr:hover { background: #f8f9fa; }
    
    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    
    .badge-pemasukan { background: #e8f5e9; color: #2e7d32; }
    .badge-pengeluaran { background: #ffebee; color: #c62828; }
    
    .nominal {
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: white;
      font-size: 1.2em;
    }
    
    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.8em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Dashboard Keuangan</h1>
    
    <div class="loading" id="loading">Memuat data...</div>
    
    <div id="dashboard-content" style="display:none;">
      <!-- Ringkasan -->
      <div class="cards">
        <div class="card card-pemasukan">
          <div class="card-icon">📥</div>
          <div class="card-title">Total Pemasukan</div>
          <div class="card-value" id="total-pemasukan">Rp0</div>
        </div>
        <div class="card card-pengeluaran">
          <div class="card-icon">📤</div>
          <div class="card-title">Total Pengeluaran</div>
          <div class="card-value" id="total-pengeluaran">Rp0</div>
        </div>
        <div class="card card-sisa">
          <div class="card-icon">🏦</div>
          <div class="card-title">Sisa</div>
          <div class="card-value" id="total-sisa">Rp0</div>
        </div>
      </div>
      
      <!-- Filter -->
      <div class="filter-section">
        <div class="filter-row">
          <div class="filter-group">
            <label>Bulan</label>
            <select id="filter-bulan">
              <option value="all">Semua Bulan</option>
              <option value="0">Januari</option>
              <option value="1">Februari</option>
              <option value="2">Maret</option>
              <option value="3">April</option>
              <option value="4">Mei</option>
              <option value="5">Juni</option>
              <option value="6">Juli</option>
              <option value="7">Agustus</option>
              <option value="8">September</option>
              <option value="9">Oktober</option>
              <option value="10">November</option>
              <option value="11">Desember</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Tahun</label>
            <select id="filter-tahun">
              <option value="all">Semua Tahun</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Kategori</label>
            <select id="filter-kategori">
              <option value="all">Semua Kategori</option>
            </select>
          </div>
          <div class="filter-group">
            <label>&nbsp;</label>
            <button onclick="applyFilter()">🔍 Terapkan Filter</button>
          </div>
        </div>
      </div>
      
      <!-- Charts -->
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">📊 Pemasukan vs Pengeluaran</div>
          <canvas id="chart-donut"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">📈 Trend 6 Bulan Terakhir</div>
          <canvas id="chart-trend"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">🏷️ Pengeluaran per Kategori</div>
          <canvas id="chart-kategori"></canvas>
        </div>
      </div>
      
      <!-- Tabel Transaksi -->
      <div class="table-section">
        <div class="table-title">📋 Detail Transaksi</div>
        <div id="table-container">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Kategori</th>
                <th>Nominal</th>
                <th>Tipe</th>
              </tr>
            </thead>
            <tbody id="transaksi-body">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let chartDonut, chartTrend, chartKategori;
    
    function formatRupiah(angka) {
      return 'Rp' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }
    
    function loadDashboard() {
      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard-content').style.display = 'block';
          
          updateCards(data);
          updateTable(data.transaksi);
          initFilters(data);
          loadCharts();
        })
        .withFailureHandler(function(error) {
          document.getElementById('loading').innerHTML = 'Error: ' + error.message;
        })
        .getDataForDashboard("all", "all", "all");
    }
    
    function updateCards(data) {
      document.getElementById('total-pemasukan').textContent = formatRupiah(data.pemasukan);
      document.getElementById('total-pengeluaran').textContent = formatRupiah(data.pengeluaran);
      document.getElementById('total-sisa').textContent = formatRupiah(data.sisa);
    }
    
    function updateTable(transaksi) {
      var tbody = document.getElementById('transaksi-body');
      tbody.innerHTML = '';
      
      if (transaksi.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">Tidak ada transaksi</td></tr>';
        return;
      }
      
      transaksi.forEach(function(t) {
        var row = document.createElement('tr');
        var badgeClass = t.tipe === 'Pemasukan' ? 'badge-pemasukan' : 'badge-pengeluaran';
        row.innerHTML = `
          <td>${t.tanggal}</td>
          <td>${t.nama}</td>
          <td>${t.kategori}</td>
          <td class="nominal">${formatRupiah(t.nominal)}</td>
          <td><span class="badge ${badgeClass}">${t.tipe}</span></td>
        `;
        tbody.appendChild(row);
      });
    }
    
    function initFilters(data) {
      // Isi tahun
      var tahunSet = new Set();
      data.bulanList.forEach(function(b) {
        var parts = b.split('-');
        tahunSet.add(parts[0]);
      });
      var selectTahun = document.getElementById('filter-tahun');
      Array.from(tahunSet).sort().forEach(function(t) {
        selectTahun.innerHTML += `<option value="${t}">${t}</option>`;
      });
      
      // Isi kategori
      var selectKategori = document.getElementById('filter-kategori');
      data.kategoriList.sort().forEach(function(k) {
        selectKategori.innerHTML += `<option value="${k}">${k}</option>`;
      });
    }
    
    function applyFilter() {
      var bulan = document.getElementById('filter-bulan').value;
      var tahun = document.getElementById('filter-tahun').value;
      var kategori = document.getElementById('filter-kategori').value;
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard-content').style.display = 'none';
      
      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashboard-content').style.display = 'block';
          
          updateCards(data);
          updateTable(data.transaksi);
          updateKategoriChart(bulan, tahun);
        })
        .getDataForDashboard(bulan, tahun, kategori);
    }
    
    function loadCharts() {
      // Donut Chart
      google.script.run.withSuccessHandler(function(data) {
        var ctx = document.getElementById('chart-donut').getContext('2d');
        chartDonut = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Pemasukan', 'Pengeluaran'],
            datasets: [{
              data: [data.pemasukan, data.pengeluaran],
              backgroundColor: ['#4CAF50', '#f44336'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });
      }).getDataForDashboard("all", "all", "all");
      
      // Trend Chart
      google.script.run.withSuccessHandler(function(trend) {
        var ctx = document.getElementById('chart-trend').getContext('2d');
        chartTrend = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: trend.labels,
            datasets: [
              {
                label: 'Pemasukan',
                data: trend.pemasukan,
                backgroundColor: '#4CAF50',
                borderRadius: 5
              },
              {
                label: 'Pengeluaran',
                data: trend.pengeluaran,
                backgroundColor: '#f44336',
                borderRadius: 5
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true }
            }
          }
        });
      }).getTrendData();
      
      // Kategori Chart
      updateKategoriChart("all", "all");
    }
    
    function updateKategoriChart(bulan, tahun) {
      google.script.run.withSuccessHandler(function(kat) {
        if (chartKategori) chartKategori.destroy();
        
        var ctx = document.getElementById('chart-kategori').getContext('2d');
        chartKategori = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: kat.labels,
            datasets: [{
              data: kat.values,
              backgroundColor: [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
              ]
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'right' }
            }
          }
        });
      }).getKategoriData(bulan, tahun);
    }
    
    // Load saat ready
    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
